name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv venv --python ${{ matrix.python-version }}
      - name: Install deps
        run: uv pip install rdkit py2opsin fastapi uvicorn requests thermo numpy scipy pydantic pytest httpx
      # `uv run` then syncs the remaining project dependencies from pyproject —
      # including the quantum stack (tblite, pyscf), which resolves from wheels on
      # Linux — so the full suite runs here, quantum tests included. The
      # pytest.importorskip guards keep it green where that stack is unavailable
      # (e.g. macOS), where those four tests skip instead. NB: this is a
      # flat-layout app, not a pip-installable package (no build-system), so deps
      # are installed directly rather than via `-e .`.
      - name: Test
        run: uv run pytest -q
