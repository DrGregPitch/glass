name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Set up Python
        run: uv venv --python ${{ matrix.python-version }}
      # The full dependency set, including the quantum stack (tblite, pyscf),
      # installs from wheels on Linux, so the complete suite runs here — the
      # GFN2-xTB and GIAO quantum tests included. The pytest.importorskip guards
      # keep the suite green on platforms where that stack is unavailable
      # (e.g. macOS), where those four tests skip instead.
      - name: Install
        run: uv pip install -e ".[dev]"
      - name: Test
        run: uv run pytest -q
